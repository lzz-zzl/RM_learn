joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50


x_omni_controller:
  type: x_omni/XOmniController
  joints: ['joint_lf', 'joint_rf', 'joint_rb', 'joint_lb']
  # 顺序必须固定：左上开始顺时针
  wheel_radius: 0.08          # 轮子半径
  wheel_distance: 0.50      # 轮子正方形边长


gazebo_ros_control:
  pid_gains:
    joint_lf: { p: 0.4 }
    joint_rf: { p: 0.4 }
    joint_lb: { p: 0.4 }
    joint_rb: { p: 0.4 }